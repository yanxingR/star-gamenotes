<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星GN · 游戏手札</title>
<meta name="description" content="星GN 游戏手札：八维评分游戏档案。">
<meta name="theme-color" content="#070d1a">
<meta property="og:type" content="website">
<meta property="og:title" content="星GN · 游戏手札">
<meta property="og:description" content="星GN 游戏手札：八维评分游戏档案。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1424'/%3E%3Cpath d='M16 5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7L6 12.3l7.1-.7z' fill='%23f2c14e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="starfield" class="starfield" aria-hidden="true"></canvas>
<div class="bg-aurora" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<header class="site-header" id="siteHeader">
  <a class="brand" href="#top">
    <span class="brand-star" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6l2.7 6.1 6.6.6-5 4.5 1.5 6.5L12 16.9 6.2 20.3l1.5-6.5-5-4.5 6.6-.6z" fill="currentColor"/></svg>
    </span>
    <span class="brand-name">星<span>GN</span></span>
    <span class="brand-sub">游戏手札 · 评分档案馆</span>
  </a>
  <nav class="site-nav" aria-label="主导航">
    <a href="#ranking">榜单</a>
  </nav>
  <a class="version-switch" href="../old.html">旧版 ↗</a>
  <div class="header-meta">
    <span class="pulse" aria-hidden="true"></span>
    <span><b id="hdrCount">—</b> 款在馆</span>
    <span class="data-status" id="dataStatus" role="status">静态快照</span>
  </div>
</header>

<main>
  <!-- ============ HERO ============ -->
  <section class="hero" id="top">
    <div class="hero-copy">
      <h1 class="hero-title"><span class="t-star">星</span><span class="t-gn">GN</span></h1>

      <div class="hero-actions">
        <a class="btn btn-primary" href="#ranking">
          浏览完整榜单
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </a>
        <button class="btn btn-ghost" id="randomBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
          随机观星
        </button>
      </div>
    </div>

    <aside class="hero-feature" id="heroFeature" aria-label="最高分作品"></aside>
  </section>

  <!-- ============ RANKING ============ -->
  <section class="section" id="ranking">
    <div class="section-head">
      <div>
        <p class="kicker">THE ARCHIVE</p>
        <h2>全部游戏</h2>
      </div>
      <div class="section-side">
        <p class="section-desc">点击任意条目查看简介、雷达与评分明细</p>
        <span class="count-pill"><b id="resultCount">0</b> 部</span>
      </div>
    </div>

    <div class="toolbar">
      <label class="search" for="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="搜索游戏、类型、厂商、年份…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>

      <div class="select-wrap">
        <select id="sortSelect" aria-label="排序方式"></select>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>

      <div class="view-toggle" role="group" aria-label="视图切换">
        <button type="button" data-view="list" class="is-active" aria-label="列表视图" title="列表视图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button type="button" data-view="grid" aria-label="画廊视图" title="画廊视图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
        </button>
      </div>
    </div>

    <div class="tier-row" id="tierChips" role="group" aria-label="按档位筛选"></div>

    <div class="filter-banner" id="filterBanner">
      <span>正在筛选：<b id="filterName"></b></span>
      <button type="button" id="clearFilter">清除筛选</button>
    </div>

    <div id="board" class="rank-list" aria-live="polite"></div>
    <div id="empty" class="empty" hidden>
      <p class="empty-title">没有找到匹配的作品</p>
      <p class="empty-sub">换个关键词或档位试试。</p>
      <button class="btn btn-ghost" id="clearSearch" type="button">清空搜索</button>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-left">
    <span class="footer-star" aria-hidden="true">✦</span>
    <div>
      <p class="footer-title">星GN · 游戏手札</p>
    </div>
  </div>
  <div class="footer-right">
    <p>更新于 <span id="genDate">—</span></p>
  </div>
</footer>

<!-- ============ DRAWER ============ -->
<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="作品详情" aria-hidden="true" inert>
  <div class="drawer-scroll" id="drawerScroll"></div>
  <button class="dclose" type="button" aria-label="关闭详情">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</aside>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
